    <script type="module">
      // Initialize mock window.openai API for ChatGPT Apps SDK
      // Only create mock if ChatGPT hasn't already provided the real API
      if (!window.openai) {
        let widgetState = {};
        window.openai = {
        toolOutput: null,
        toolInput: null,
        toolResponseMetadata: {},
        widgetState,
        displayMode: "inline",
        view: { mode: "inline", params: {} },
        theme: "light",
        maxHeight: 1200,
        safeArea: { insets: { top: 0, bottom: 0, left: 0, right: 0 } },
        locale: "en-US",
        userAgent: { device: { type: "desktop" }, capabilities: { hover: true, touch: false } },
        callTool: async (name, args) => {
          console.log("[Apps SDK] Call Tool:", name, args);

          // Send tool call request to parent window
          if (window.parent !== window) {
            const requestId = "tool-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);

            return new Promise((resolve, reject) => {
              const timeout = setTimeout(() => {
                cleanup();
                reject(new Error('Tool call timeout'));
              }, 30000); // 30 second timeout

              const handler = (event) => {
                if (event.data?.type === 'TOOL_RESULT' && event.data.requestId === requestId) {
                  cleanup();
                  if (event.data.error) {
                    reject(new Error(event.data.error));
                  } else {
                    // Return full result for data tools, wrapped content for UI tools
                    resolve(event.data.result ?? { content: event.data.content || [] });
                  }
                }
              };

              const cleanup = () => {
                clearTimeout(timeout);
                window.removeEventListener('message', handler);
              };

              window.addEventListener('message', handler);
              window.parent.postMessage({
                type: 'CALL_TOOL',
                requestId,
                toolName: name,
                arguments: args
              }, '*');
            });
          }

          // Fallback for non-iframe context
          return { content: [] };
        },
        requestDisplayMode: async (opts) => {
          console.log("[Apps SDK] Request Display Mode:", opts);

          // Send request to parent window
          if (window.parent !== window) {
            window.parent.postMessage({
              type: 'REQUEST_DISPLAY_MODE',
              mode: opts.mode
            }, '*');
          }

          return { mode: opts.mode };
        },
        requestModal: async (opts) => {
          console.log("[Apps SDK] Request Modal:", opts);

          // Send modal request to parent window with request/response pattern
          if (window.parent !== window) {
            const requestId = "modal-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);

            // Get anchor rect if anchorElement provided (for positioning)
            let anchor = undefined;
            if (opts.anchorElement) {
              const rect = opts.anchorElement.getBoundingClientRect();
              anchor = {
                top: rect.top,
                left: rect.left,
                width: rect.width,
                height: rect.height
              };
            }

            return new Promise((resolve) => {
              const timeout = setTimeout(() => {
                cleanup();
                resolve(); // Resolve silently on timeout (matches OpenAI behavior)
              }, 30000);

              const handler = (event) => {
                if (event.data?.type === 'MODAL_RESULT' && event.data.requestId === requestId) {
                  cleanup();
                  resolve(); // Always resolve (Promise<void>)
                }
              };

              const cleanup = () => {
                clearTimeout(timeout);
                window.removeEventListener('message', handler);
              };

              window.addEventListener('message', handler);
              window.parent.postMessage({
                type: 'REQUEST_MODAL',
                requestId,
                title: opts.title,
                params: opts.params || {},
                anchor
              }, '*');
            });
          }

          // Fallback for non-iframe context - resolve silently
          return Promise.resolve();
        },
        notifyIntrinsicHeight: (height) => {
          // Send height to parent window for iframe resizing
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'NOTIFY_HEIGHT', height }, '*');
          }
        },
        setWidgetState: async (state) => {
          widgetState = { ...widgetState, ...state };
          window.openai.widgetState = widgetState;
          console.log("[Apps SDK] Set Widget State:", state);
          window.dispatchEvent(new CustomEvent('openai:set_globals', {
            detail: {
              globals: {
                widgetState: window.openai.widgetState
              }
            }
          }));
          // Notify parent window of state change (for preview environment)
          if (window.parent !== window) {
            window.parent.postMessage({
              type: 'SET_WIDGET_STATE',
              state: widgetState
            }, '*');
          }
        },
        sendFollowUpMessage: async (args) => {
          console.log("[Apps SDK] Follow Up:", args);

          // Send follow-up message to parent window
          if (window.parent !== window) {
            window.parent.postMessage({
              type: 'SEND_FOLLOW_UP',
              message: args.message || args
            }, '*');
          }
        },
        openExternal: (arg) => {
          // Accept both string and { href } object formats
          const href = typeof arg === 'string' ? arg : arg?.href;
          console.log("[Apps SDK] Open External:", href);

          // Send request to parent window for permission check
          if (window.parent !== window) {
            window.parent.postMessage({
              type: 'OPEN_EXTERNAL',
              href
            }, '*');
          } else {
            // Fallback: open directly if not in iframe
            if (href) {
              window.open(href, '_blank', 'noopener,noreferrer');
            }
          }
        },
        requestClose: () => {
          console.log("[Apps SDK] Request Close");

          // Send close request to parent window
          if (window.parent !== window) {
            window.parent.postMessage({
              type: 'REQUEST_CLOSE'
            }, '*');
          }
        }
        };
      } // end if (!window.openai)

      // Listen for mock data from parent window (for sandboxed iframe)
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'MOCK_DATA') {
          console.log("[iframe] Received mock data from parent:", event.data);
          window.openai.toolOutput = event.data.toolOutput || null;
          window.openai.toolInput = event.data.toolInput || null;
          window.openai.toolResponseMetadata = event.data.toolResponseMetadata || {};
          window.openai.theme = event.data.theme || 'light';
          // Sync data-theme attribute for Apps SDK UI styling
          document.documentElement.setAttribute('data-theme', window.openai.theme);
          window.openai.displayMode = event.data.displayMode || 'inline';
          window.openai.maxHeight = event.data.maxHeight || window.openai.maxHeight || 1200;
          window.openai.locale = event.data.locale || window.openai.locale || 'en-US';
          // Only set widgetState if explicitly provided - don't default to {} so SDK defaults work
          if (event.data.widgetState !== undefined) {
            window.openai.widgetState = event.data.widgetState;
          }
          window.openai.safeArea = event.data.safeArea || window.openai.safeArea || { insets: { top: 0, bottom: 0, left: 0, right: 0 } };
          window.openai.view = event.data.view || window.openai.view || { mode: "inline", params: {} };

          // ALWAYS trigger re-render when data changes (not just initial load)
          // This ensures React components update when parameters are edited
          window.dispatchEvent(new CustomEvent('openai:set_globals', {
            detail: {
              globals: {
                toolOutput: window.openai.toolOutput,
                toolInput: window.openai.toolInput,
                toolResponseMetadata: window.openai.toolResponseMetadata,
                theme: window.openai.theme,
                displayMode: window.openai.displayMode,
                maxHeight: window.openai.maxHeight,
                locale: window.openai.locale,
                widgetState: window.openai.widgetState,
                safeArea: window.openai.safeArea,
                view: window.openai.view
              }
            }
          }));
        }

        // Handle modal close from parent
        if (event.data && event.data.type === 'MODAL_CLOSE') {
          window.openai.view = { mode: "inline", params: {} };
          window.dispatchEvent(new CustomEvent('openai:set_globals', {
            detail: { globals: { view: window.openai.view } }
          }));
        }
      });

      // Auto-detect and report content height
      function notifyHeight() {
        if (window.parent !== window && window.openai?.notifyIntrinsicHeight) {
          const root = document.getElementById('root');
          // Use plain JS to stay runtime-safe inside the iframe bundle
          const child = root && root.firstElementChild;

          // Prefer the rendered child height; fall back to scrollHeight to capture overflow
          const childRectHeight = child?.getBoundingClientRect().height || 0;
          const childScrollHeight = child?.scrollHeight || 0;
          const height = Math.ceil(Math.max(childRectHeight, childScrollHeight));

          if (height > 0) {
            window.openai.notifyIntrinsicHeight(height);
          }
        }
      }

      // Notify height after initial render
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          setTimeout(notifyHeight, 100);
        });
      } else {
        setTimeout(notifyHeight, 100);
      }

      // Re-notify on window resize or mutations
      window.addEventListener('resize', notifyHeight);

      // Watch for DOM changes that might affect height
      const mutationObserver = new MutationObserver(() => {
        notifyHeight();
      });

      mutationObserver.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true
      });

      // Watch for layout/size changes to keep height accurate (images/fonts/layout shifts)
      try {
        if ('ResizeObserver' in window) {
          const resizeObserver = new ResizeObserver(() => notifyHeight());
          // Observe body (catches React render into #root)
          resizeObserver.observe(document.body);
          // Also observe #root if it exists
          const root = document.getElementById('root');
          if (root) {
            resizeObserver.observe(root);
          }
        }
      } catch (err) {
        console.warn("[Apps SDK] ResizeObserver setup failed", err);
      }
